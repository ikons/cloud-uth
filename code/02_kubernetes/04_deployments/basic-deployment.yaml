apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  # Deploy three interchangeable Nginx replicas.
  replicas: 3
  selector:
    matchLabels:
      app: nginx-deploy
  template:
    metadata:
      labels:
        app: nginx-deploy
    spec:
      containers:
        - name: nginx
          image: nginx:1.24
          ports:
            # The container serves HTTP traffic on port 80.
            - containerPort: 80
